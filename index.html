<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя Автоматическая Галерея</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 { color: #333; }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 20px auto;
            padding: 10px;
        }
        .photo-card {
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .photo-card:hover { transform: scale(1.03); }
        .photo-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }
        .photo-caption {
            padding: 10px;
            font-size: 14px;
            color: #666;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Моя Галерея Фотографий</h1>
    <p>Все фотографии загружаются автоматически</p>

    <!-- Сюда скрипт сам добавит все фотографии -->
    <div class="gallery" id="galleryContainer"></div>

    <script>
        // === НАСТРОЙКА: ПРОСТО УКАЖИТЕ КОЛИЧЕСТВО ФОТОГРАФИЙ ===
        const totalPhotos = 503; // Сейчас выводится 10. Поменяйте на 15, 50 или 100!

        const container = document.getElementById('galleryContainer');

        // Цикл автоматически создаёт HTML-код для каждой фотографии
        for (let i = 1; i <= totalPhotos; i++) {
            const card = document.createElement('div');
            card.className = 'photo-card';

            card.innerHTML = `
                <img src="${i}_jpeg" alt="Фото ${i}" loading="lazy">
                <div class="photo-caption">Фотография ${i}</div>
            `;

            container.appendChild(card);
        }
    </script>

</body>
</html>
