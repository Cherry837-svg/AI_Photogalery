 <!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>moya avto gallery    body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        margin: 0;
        padding: 20px;
        text-align: center;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        -webkit-user-select: none;
    }

    .lightbox {
        display: none;
        position: fixed;
        z-index: 999;
        top: 0; left: 0; width: 100%; height: 100%;
        background-color: rgba(0, 0, 0, 0.95);
        justify-content: center;
        align-items: center;
    }

    .lightbox img {
        .lightbox img {
            width: auto;
            height: auto;
            max-width: 90%;
            max-height: 85vh;
            min-width: 350px;
            object-fit: contain;
            box-shadow: 0 0 30px rgba(255,255,255,0.1);
            border-radius: 4px;
        }
        .close-btn {
            position: absolute;
            top: 20px; right: 30px;
            color: #fff; font-size: 40px; font-weight: bold;
            cursor: pointer;
        }
        .nav-hint {
            position: absolute;
            bottom: 20px; color: #888; font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>Моя Галерея Фотографий</h1>
    <p>Кликните на любое фото, чтобы открыть на весь экран (Листайте стрелками ◄ и ►)</p>

    <div class="gallery" id="galleryContainer"></div>

    <!-- Полноэкранный блок -->
    <div class="lightbox" id="lightbox">
        <span class="close-btn" id="closeBtn">&times;</span>
        <img id="lightboxImg" src="" alt="">
        <div class="nav-hint">Используйте стрелки влево/вправо на клавиатуре. Выход — Esc</div>
    </div>

    <script>
        const totalPhotos = 503; // Количество ваших фото
        const container = document.getElementById('galleryContainer');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        const closeBtn = document.getElementById('closeBtn');
        
        let currentIdx = 1; // Индекс текущего открытого фото

        // Функция открытия во весь экран
        function openLightbox(index) {
            currentIdx = index;
            lightboxImg.src = `${currentIdx}_jpeg.jpg`;
            lightbox.style.display = 'flex';
        }

        // Функция закрытия
        function closeLightbox() {
            lightbox.style.display = 'none';
        }

        // Автоматически строим галерею
        for (let i = 1; i <= totalPhotos; i++) {
            const card = document.createElement('div');
            card.className = 'photo-card';
            card.innerHTML = `
                <img src="${i}_jpeg.jpg" alt="Фото ${i}" loading="lazy">
                <div class="photo-caption">Фотография ${i}</div>
            `;
            // При клике на карточку открываем её во весь экран
            card.addEventListener('click', () => openLightbox(i));
            container.appendChild(card);
        }

        // Закрытие по крестику
        closeBtn.addEventListener('click', closeLightbox);
        // Закрытие по клику на темный фон
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) closeLightbox();
        });

        // УПРАВЛЕНИЕ КЛАВИАТУРОЙ (ДЖОЙСТИКОМ)
        document.addEventListener('keydown', (e) => {
            if (lightbox.style.display === 'flex') {
                if (e.key === 'ArrowRight') { // Стрелка вправо
                    currentIdx = currentIdx >= totalPhotos ? 1 : currentIdx + 1;
                    lightboxImg.src = `${currentIdx}_jpeg.jpg`;
                } else if (e.key === 'ArrowLeft') { // Стрелка влево
                    currentIdx = currentIdx <= 1 ? totalPhotos : currentIdx - 1;
                    lightboxImg.src = `${currentIdx}_jpeg.jpg`;
                } else if (e.key === 'Escape') { // Кнопка Esc для выхода
                    closeLightbox();
                }
            }
        });
    </script>

</body>
</html>
